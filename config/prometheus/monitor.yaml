# Prometheus Monitor Service (Metrics)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: slo-guardian
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: https # Ensure this is the name of the port that exposes HTTPS metrics
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        tlsConfig:
        # Using insecureSkipVerify here deliberately: enabling proper cert verification
        # requires wiring up cert-manager + webhook infrastructure, which this project
        # doesn't otherwise need (no admission/validation webhooks). For a cluster with
        # cert-manager already installed, config/prometheus/servicemonitor_tls_patch.yaml
        # is the documented kubebuilder path to do this properly.
        insecureSkipVerify: true
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: slo-guardian
