# This rule is not used by the project slo-guardian itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the sre.sre.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: slo-guardian
    app.kubernetes.io/managed-by: kustomize
  name: slopolicy-editor-role
rules:
- apiGroups:
  - sre.sre.dev
  resources:
  - slopolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sre.sre.dev
  resources:
  - slopolicies/status
  verbs:
  - get
