---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sre.sre.dev
  resources:
  - slopolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sre.sre.dev
  resources:
  - slopolicies/finalizers
  verbs:
  - update
- apiGroups:
  - sre.sre.dev
  resources:
  - slopolicies/status
  verbs:
  - get
  - patch
  - update
